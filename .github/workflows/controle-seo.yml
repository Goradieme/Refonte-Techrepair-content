# Contrôle SEO et GEO de l'article du jour, règle fixée par Goradieme : tout nouvel
# article doit respecter les normes SEO et GEO avant d'être publié.
#
# À chaque demande de fusion « article/… », les nouveaux articles sont passés au crible par
# _outils/controle_seo.py. En cas de point bloquant, la demande reçoit les étiquettes
# « attendre » (qui suspend la publication de 8 h) et « seo-a-corriger », avec le détail en
# commentaire. Dès que le contrôle repasse au vert, les deux étiquettes sont retirées.
name: Contrôle SEO et GEO de l'article

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: controle-seo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  controler:
    if: startsWith(github.head_ref, 'article/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Contrôler les nouveaux articles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          set -u
          slugs=$(git diff --name-only --diff-filter=A "origin/$BASE...HEAD" -- 'articles/article-*.html' \
                  | sed -e 's#^articles/article-##' -e 's#\.html$##')
          if [ -z "$slugs" ]; then echo "Aucun nouvel article dans cette demande."; exit 0; fi
          etiquettes=$(gh api "repos/$REPO/issues/$N/labels" --jq '.[].name')
          if python3 _outils/controle_seo.py $slugs > rapport.txt 2>&1; then
            cat rapport.txt
            if echo "$etiquettes" | grep -qx seo-a-corriger; then
              gh api -X DELETE "repos/$REPO/issues/$N/labels/seo-a-corriger" >/dev/null || true
              # « attendre » n'est retirée que si c'est ce contrôle qui l'a posée :
              # une mise en attente décidée par Goradieme reste en place.
              par=$(gh api "repos/$REPO/issues/$N/events" --paginate \
                    --jq '[.[] | select(.event == "labeled" and .label.name == "attendre")] | last | .actor.login')
              if [ "$par" = "github-actions[bot]" ]; then
                gh api -X DELETE "repos/$REPO/issues/$N/labels/attendre" >/dev/null || true
              fi
              gh api "repos/$REPO/issues/$N/comments" -f body="Contrôle SEO et GEO : tous les points bloquants sont corrigés, la publication reprend son cours." >/dev/null
            fi
            exit 0
          fi
          cat rapport.txt
          gh api "repos/$REPO/labels" -f name=seo-a-corriger -f color=D93F0B -f description="Contrôle SEO/GEO en échec" >/dev/null 2>&1 || true
          gh api "repos/$REPO/labels" -f name=attendre -f color=FBCA04 >/dev/null 2>&1 || true
          if echo "$etiquettes" | grep -qx attendre; then
            gh api "repos/$REPO/issues/$N/labels" -f "labels[]=seo-a-corriger" >/dev/null
          else
            gh api "repos/$REPO/issues/$N/labels" -f "labels[]=attendre" -f "labels[]=seo-a-corriger" >/dev/null
          fi
          {
            echo "**Contrôle SEO et GEO : article non conforme, publication suspendue.**"
            echo
            echo '```'
            cat rapport.txt
            echo '```'
            echo "Corriger le brouillon, relancer \`publier_article.py\`, puis pousser : le contrôle se relance tout seul."
          } > commentaire.md
          gh api "repos/$REPO/issues/$N/comments" -F body=@commentaire.md >/dev/null
          exit 1

backend:
  name: git-gateway
  branch: main

media_folder: articles/images
public_folder: /articles/images

locale: fr

collections:
  - name: articles
    label: Articles de blog
    folder: articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Auteur, name: auteur, widget: string, default: Goradieme }
      - label: Catégorie
        name: categorie
        widget: select
        options:
          - { label: "SEO", value: seo }
          - { label: "SaaS B2B", value: saas }
          - { label: "E-commerce", value: ecommerce }
          - { label: "Cybersécurité", value: cyber }
          - { label: "Fintech", value: fintech }
          - { label: "RH Tech", value: rh }
      - { label: Temps de lecture, name: lecture, widget: string, default: "5 min" }
      - { label: Description courte, name: extrait, widget: text }
      - { label: Contenu, name: body, widget: markdown }

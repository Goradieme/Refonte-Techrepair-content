backend:
  name: git-gateway
  branch: principal

media_folder: articles/images
public_folder: /articles/images

locale: fr

collections:
  - name: articles
    label: Articles de blog
    label_singular: Article
    folder: articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "articles/{{slug}}.html"
    fields:
      - label: Titre
        name: title
        widget: string
        hint: "Le titre SEO principal de votre article"

      - label: Date de publication
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false

      - label: Auteur
        name: auteur
        widget: string
        default: Goradieme

      - label: Catégorie
        name: categorie
        widget: select
        options:
          - { label: "📊 SEO & Technique", value: seo }
          - { label: "☁️ SaaS B2B", value: saas }
          - { label: "🛒 E-commerce Tech", value: ecommerce }
          - { label: "🔒 Cybersécurité", value: cyber }
          - { label: "💳 Fintech", value: fintech }
          - { label: "👥 RH Tech", value: rh }

      - label: Temps de lecture
        name: lecture
        widget: string
        default: "5 min"
        hint: "Ex : 7 min"

      - label: Description courte
        name: extrait
        widget: text
        hint: "Résumé visible dans la carte blog (150 à 200 caractères)"

      - label: Contenu de l'article
        name: body
        widget: markdown
        hint: "Rédigez votre article ici avec l'éditeur visuel"

      - label: Mot-clé principal
        name: mot_cle
        widget: string
        required: false
        hint: "Le mot-clé SEO principal de l'article"

      - label: Meta description
        name: meta_description
        widget: text
        required: false
        hint: "Description pour Google (145 à 160 caractères)"
